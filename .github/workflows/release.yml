# Al subir un tag (git tag v0.1.0 && git push --tags) compila fysh
# para Windows, Linux y Mac y publica los ejecutables en GitHub Releases.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: fysh-windows-x86_64.exe
            out: target/release/fysh.exe
          # Linux estático (musl): funciona en cualquier Linux x86_64, también en Alpine.
          - os: ubuntu-latest
            asset: fysh-linux-x86_64
            target: x86_64-unknown-linux-musl
            out: target/x86_64-unknown-linux-musl/release/fysh
          - os: macos-latest
            asset: fysh-macos-aarch64
            out: target/release/fysh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test
      - shell: bash
        run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - shell: bash
        run: cp ${{ matrix.out }} ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
