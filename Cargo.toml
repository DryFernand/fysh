[package]
name = "fysh"
version = "0.2.0"
edition = "2021"

[dependencies]
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
rustyline = "14"
trash = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
