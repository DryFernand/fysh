[package]
name = "fysh"
version = "0.2.0"
edition = "2021"

[dependencies]
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
